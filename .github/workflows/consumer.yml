name: consumer

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/consumer-smoke.mjs
