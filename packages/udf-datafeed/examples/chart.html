<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UDF datafeed demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #0b0e11;
        color: #d6d9dd;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 18px 24px;
        border-bottom: 1px solid #1e242c;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0;
      }
      #status {
        font-size: 12px;
        color: #7c8591;
      }
      #chart {
        height: calc(100vh - 62px);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>@rtkit/udf-datafeed</h1>
      <span id="status">loading…</span>
    </header>
    <div id="chart"></div>

    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script>
      const status = document.getElementById("status");
      const chart = LightweightCharts.createChart(document.getElementById("chart"), {
        layout: { background: { color: "#0b0e11" }, textColor: "#9aa3ad" },
        grid: { vertLines: { color: "#161b22" }, horzLines: { color: "#161b22" } },
        rightPriceScale: { borderColor: "#1e242c" },
        timeScale: { borderColor: "#1e242c", timeVisible: true },
      });
      const series = chart.addCandlestickSeries({
        upColor: "#3fb950",
        downColor: "#f85149",
        borderVisible: false,
        wickUpColor: "#3fb950",
        wickDownColor: "#f85149",
      });

      const to = Math.floor(Date.now() / 1000);
      const from = to - 7 * 24 * 3600;
      const url = `/udf/history?symbol=BTCUSDT&resolution=60&from=${from}&to=${to}`;

      fetch(url)
        .then((response) => response.json())
        .then((data) => {
          if (data.s !== "ok") {
            status.textContent = `history error: ${data.s} ${data.errmsg ?? ""}`;
            return;
          }
          series.setData(
            data.t.map((time, i) => ({
              time,
              open: data.o[i],
              high: data.h[i],
              low: data.l[i],
              close: data.c[i],
            })),
          );
          chart.timeScale().fitContent();
          status.textContent = `${data.t.length} bars · ${url}`;
        })
        .catch((error) => {
          status.textContent = `request failed: ${error.message}`;
        });

      new ResizeObserver(() => {
        chart.applyOptions({ width: document.getElementById("chart").clientWidth });
      }).observe(document.getElementById("chart"));
    </script>
  </body>
</html>
